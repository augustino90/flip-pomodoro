<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policy - Flip Pomodoro</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #ffffff;
            --text-secondary: #e2e8f0; 
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --border-color: #334155;
            --btn-bg: #334155;
            --btn-active: #38bdf8;
            --btn-active-text: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            margin: 20px 0;
        }

        header {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 24px;
            margin-bottom: 32px;
        }
        
        .logo-wrapper {
            display: inline-block;
            position: relative;
            padding: 8px;
        }

        .logo-wrapper::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 110px;
            height: 110px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 50%;
            filter: blur(16px);
            z-index: 1;
        }

        .logo {
            width: 180px;
            height: 180px;
            position: relative;
            z-index: 2;
            display: block;
            margin: 0 auto;
        }

        h1 {
            font-size: 2rem;
            margin-top: 12px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .app-subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .lang-switch {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }

        .lang-btn {
            background-color: var(--btn-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .lang-btn.active {
            background-color: var(--btn-active);
            color: var(--btn-active-text);
            border-color: var(--btn-active);
        }

        .content-section {
            display: none;
        }

        .content-section.active {
            display: block;
        }

        .effective-date {
            font-style: italic;
            color: var(--text-secondary);
            margin-bottom: 24px;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 8px;
            display: inline-block;
        }

        h2 {
            font-size: 1.25rem;
            color: var(--accent-color);
            margin-top: 28px;
            margin-bottom: 12px;
        }

        p, ul, li {
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-size: 1rem;
            line-height: 1.7;
        }

        ul {
            padding-left: 20px;
        }

        li {
            margin-bottom: 8px;
        }

        strong {
            color: var(--text-primary);
        }

        a {
            color: var(--accent-color);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .contact-box {
            background-color: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 16px;
            border-radius: 10px;
            margin-top: 12px;
            color: var(--text-primary);
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            .logo {
                width: 140px;
                height: 140px;
            }
            h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-wrapper">
                <svg class="logo" viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="bgGradient" cx="54" cy="54" r="76.4" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#334155"/>
                            <stop offset="50%" stop-color="#1E293B"/>
                            <stop offset="100%" stop-color="#0F172A"/>
                        </radialGradient>
                    </defs>
                    <path d="M 54,21 A 33,33 0 1,1 54,87 A 33,33 0 1,1 54,21" fill="url(#bgGradient)"/>
                    <path fill="#ffffff" d="
                        M 54.729,66.052 A 2.844,2.844 0 1,1 54.729,71.740 A 2.844,2.844 0 1,1 54.729,66.052
                        M 48.136,46.385 A 7.355,7.281 0 0,0 33.427,46.385 L 37.511,46.385 A 3.271,3.240 0 0,1 44.052,46.385 Z
                        M 33.421,61.604 A 7.355,7.276 0 0,0 48.131,61.604 L 44.047,61.604 A 3.271,3.240 0 0,1 37.505,61.604 Z
                        M 76.031,46.385 A 7.355,7.281 0 0,0 61.328,46.385 L 65.407,46.385 A 3.271,3.240 0 0,1 71.948,46.385 Z
                        M 61.323,61.604 A 7.355,7.276 0 0,0 76.031,61.604 L 71.948,61.604 A 3.271,3.240 0 0,1 65.407,61.604 Z" />
                    <path fill="#ffffff" d="
                        M 33.432,46.328 L 37.511,46.328 L 37.511,52.995 L 33.432,52.995 Z
                        M 33.432,55.011 L 37.511,55.011 L 37.511,61.677 L 33.432,61.677 Z
                        M 44.052,46.328 L 48.136,46.328 L 48.136,52.995 L 44.052,52.995 Z
                        M 44.052,55.011 L 48.136,55.011 L 48.136,61.677 L 44.052,61.677 Z
                        M 61.328,46.328 L 65.412,46.328 L 65.412,52.995 L 61.328,52.995 Z
                        M 61.328,55.011 L 65.412,55.011 L 65.412,61.677 L 61.328,61.677 Z
                        M 71.948,46.328 L 76.031,46.328 L 76.031,52.995 L 71.948,52.995 Z
                        M 71.948,55.011 L 76.031,55.011 L 76.031,61.677 L 71.948,61.677 Z" />
                </svg>
            </div>
            <h1>Flip Pomodoro</h1>
            
        </header>
    </div>

    <script>
        function switchLang(lang) {
            document.querySelectorAll('.content-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.lang-btn').forEach(el => el.classList.remove('active'));

            if (lang === 'en') {
                document.getElementById('lang-en').classList.add('active');
                event.target.classList.add('active');
            } else {
                document.getElementById('lang-vi').classList.add('active');
                event.target.classList.add('active');
            }
        }
    </script>
</body>
</html>
